# Paper trading is the only mode this file can start by itself.
# live_trading must stay false. Turning it on does nothing unless LIVE_TRADING=true
# in the environment, --enable-live is passed, and you type the confirmation phrase
# in an interactive terminal. See README.

live_trading: false

symbols:
  - BTC/USDT
  - ETH/USDT

# How often the scheduler wakes. Candle timeframes below are separate.
cycle_interval_minutes: 15

# MOM-03 in the knowledge base is an hourly strategy. 15m is context only.
primary_timeframe: 1h
timeframes:
  - 15m
  - 1h
  - 4h
  - 1d

# A closed candle older than this multiple of its timeframe is stale.
# Stale symbols are not traded.
stale_candle_multiple: 2.0
candle_limit: 300

exchange:
  # binance uses ccxt sandbox mode (Spot Testnet: testnet.binance.vision).
  # simulated is a local paper exchange for tests and for running without keys.
  # alpaca or kraken can be swapped in here; paper mode still refuses production hosts.
  id: binance
  sandbox: true
  market_type: spot
  quote_currency: USDT
  initial_quote: 10000.0

risk:
  # Tighter than the knowledge-base 35% BTC/ETH cap. The risk manager overrides the LLM.
  max_position_size_pct: 10
  max_total_exposure_pct: 40
  max_daily_loss_pct: 3
  max_drawdown_pct: 15
  max_trades_per_day: 8
  # Distance checks are measured from the reference price to the stop.
  min_stop_distance_pct: 0.4
  max_stop_distance_pct: 8
  default_stop_atr_mult: 1.8
  default_take_profit_atr_mult: 3.0
  cooldown_after_loss_minutes: 60
  slippage_bps: 5
  fee_bps: 10
  min_confidence: 0.55
  min_trade_pct: 1
  allow_short: false

llm:
  model: claude-sonnet-4-5
  max_tokens: 2500
  # Invalid JSON is retried this many times after the first response, then HOLD.
  max_retries: 2
  timeout_seconds: 45
  # Cache the strategy block when it is large enough for Anthropic prompt caching.
  prompt_cache_min_chars: 4000

social:
  # Enabled sources are constructed at startup. Missing credentials are skipped.
  enabled_sources:
    - twitter
    - reddit
    - instagram
  cashtags:
    - $BTC
    - $ETH
  accounts: []
  subreddits:
    - cryptocurrency
    - bitcoin
    - ethereum
  cache_ttl_seconds: 300
  max_posts_per_source: 25
  request_timeout_seconds: 20
  min_interval_seconds: 2
  retries: 2
  # lexicon is the default. llm batches posts and falls back to the lexicon.
  sentiment_mode: lexicon
  spike_post_count: 25
  prompt_post_limit: 12

strategy:
  directory: strategy_context
  # auto uses the full text when it fits, otherwise retrieves relevant chunks.
  mode: auto
  full_max_chars: 120000
  chunk_chars: 2500
  top_k: 6

monitoring:
  database: logs/agent.sqlite
  jsonl_path: logs/cycles.jsonl
  log_path: logs/agent.jsonl
  kill_switch_file: KILL_SWITCH

backtest:
  timeframe: 1h
  warmup_bars: 1440
  # Deterministic MOM-03 baseline. The LLM is not called unless you opt in.
  decision: baseline
