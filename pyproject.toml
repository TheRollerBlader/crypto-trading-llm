[project]
name = "crypto-trading-agent"
version = "0.1.0"
description = "Paper-trading-first crypto agent. An LLM proposes decisions; a hard-coded risk manager and sandbox broker decide what, if anything, is sent."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = [
  "agent",
  "backtest",
  "core",
  "data",
  "execution",
  "monitoring",
  "risk",
  "signals",
  "strategy",
]
